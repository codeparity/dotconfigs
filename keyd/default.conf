# keyd — system-wide key remapper (see: man keyd)
#
# LAYER OWNERSHIP
# This file is the single source of truth for physical -> logical key
# remapping. keyd sits below the display server, so these mappings work
# identically under X, Wayland and a bare TTY, and survive a change of
# desktop environment. Do NOT duplicate anything from here in ~/.Xmodmap
# or in the DE's own keybindings — a mapping owned by two layers is the
# usual cause of "phantom keypress" bugs.
#
# Global shortcuts that LAUNCH programs stay in the DE (dconf), not here:
# keyd runs as root, so command() would start GUI apps as root with no
# $DISPLAY. Keep this file to remapping only.

[ids]
# A single keyboard often presents several input interfaces that share one
# vendor:product ID, so they cannot reliably be told apart here. Anything
# that needs to target one of them is handled per-key in [main] below.
*

[main]
# Two different codes both resolve to the `Print` keysym in X:
#
#   KEY_SYSRQ  (evdev 99  -> X 107)  the physical PrtSc key
#   KEY_PRINT  (evdev 210 -> X 218)  a media/consumer-control input path
#
# Because X collapses both onto one keysym, a global grab on a bare `Print`
# fires from stray media traffic just as readily as from a deliberate press,
# which makes a screenshot tool appear to launch itself at random.
#
# Swallow the media path only. `sysrq` is deliberately left untouched, so the
# physical PrtSc key keeps working as the screenshot hotkey.
print = noop

[meta]
h = left
j = down
k = up
l = right
u = pageup
n = pagedown
b = backspace
r = delete
v = S-insert

# NOTE: toggle() is intentional and must not be "simplified" to layer().
# [swapped] is a persistent mode, so it has to latch; a momentary layer
# would mean holding capslock in order to make capslock behave as esc.
# If the layer ever gets stuck, press meta+capslock again or `keyd reload`.
capslock = toggle(swapped)

[swapped]
# Swap the behavior of Escape and Caps Lock in this layer
capslock = esc
esc = capslock
